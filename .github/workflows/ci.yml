name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
          pip install ruff
      - name: Lint
        run: ruff check src tests
      - name: Test (unit only — no real LLM/MCP)
        run: pytest tests/unit -v --cov --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
