<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
  <title id="title">code_minions acceptance evidence flow</title>
  <desc id="desc">Standalone flow diagram showing how test results, delivery gates, task coverage, and platform evidence become structured acceptance items, verifier rounds, final evidence reports, and auditable product acceptance advantages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
      .skill { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .item { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; }
      .verify { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; }
      .output { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.4; }
      .state { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; }
      .titleText { fill: #0f172a; font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bandTitle { fill: #0f172a; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334155; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1010"/>
  <text x="48" y="54" class="titleText">Acceptance Evidence as a First-Class Flow</text>
  <text x="48" y="82" class="subtitle">A standalone view of how generated tests and delivery checks become structured product acceptance evidence.</text>

  <rect x="42" y="120" width="1416" height="126" rx="12" class="band"/>
  <text x="64" y="150" class="bandTitle">1. Raw Implementation Evidence</text>
  <rect x="72" y="174" width="210" height="48" rx="8" class="input"/>
  <text x="90" y="196" class="label">Task Results</text>
  <text x="90" y="214" class="small">files_changed, commit_sha, status</text>
  <rect x="314" y="174" width="210" height="48" rx="8" class="input"/>
  <text x="332" y="196" class="label">Test Results</text>
  <text x="332" y="214" class="small">pytest, Vitest, xcodebuild, etc.</text>
  <rect x="556" y="174" width="210" height="48" rx="8" class="input"/>
  <text x="574" y="196" class="label">Delivery Profile</text>
  <text x="574" y="214" class="small">stack_id, required files, gates</text>
  <rect x="798" y="174" width="210" height="48" rx="8" class="input"/>
  <text x="816" y="196" class="label">Worktree Evidence</text>
  <text x="816" y="214" class="small">languages, build system, app entry</text>
  <rect x="1040" y="174" width="205" height="48" rx="8" class="input"/>
  <text x="1058" y="196" class="label">Parsed PRD Tasks</text>
  <text x="1058" y="214" class="small">contract and task coverage target</text>

  <rect x="42" y="286" width="1416" height="104" rx="12" class="band"/>
  <text x="64" y="316" class="bandTitle">2. Deterministic Product Acceptance Review</text>
  <rect x="92" y="336" width="310" height="34" rx="8" class="skill"/>
  <text x="112" y="358" class="label">product-acceptance-review</text>
  <rect x="468" y="336" width="270" height="34" rx="8" class="skill"/>
  <text x="488" y="358" class="label">validate_delivery_profile()</text>
  <rect x="804" y="336" width="330" height="34" rx="8" class="skill"/>
  <text x="824" y="358" class="label">coverage + platform classification</text>

  <rect x="42" y="430" width="1416" height="170" rx="12" class="band"/>
  <text x="64" y="460" class="bandTitle">3. Structured Acceptance Items</text>
  <rect x="72" y="486" width="225" height="72" rx="8" class="item"/>
  <text x="90" y="509" class="label">Task Items</text>
  <text x="90" y="529" class="mono">task:&lt;id&gt;</text>
  <text x="90" y="546" class="small">pass/fail from files + tests</text>
  <rect x="327" y="486" width="245" height="72" rx="8" class="item"/>
  <text x="345" y="509" class="label">Delivery Items</text>
  <text x="345" y="529" class="mono">delivery-profile:&lt;code&gt;</text>
  <text x="345" y="546" class="small">required files, routes, deps, syntax</text>
  <rect x="602" y="486" width="225" height="72" rx="8" class="item"/>
  <text x="620" y="509" class="label">Platform Items</text>
  <text x="620" y="529" class="mono">platform:&lt;code&gt;</text>
  <text x="620" y="546" class="small">language, app entry, build system</text>
  <rect x="857" y="486" width="225" height="72" rx="8" class="item"/>
  <text x="875" y="509" class="label">Artifact Items</text>
  <text x="875" y="529" class="mono">artifact:&lt;code&gt;</text>
  <text x="875" y="546" class="small">prototype warnings and evidence</text>
  <rect x="1112" y="486" width="190" height="72" rx="8" class="state"/>
  <text x="1130" y="509" class="label">Schema</text>
  <text x="1130" y="529" class="mono">acceptance_items</text>
  <text x="1130" y="546" class="small">id, kind, status, evidence</text>

  <rect x="42" y="640" width="1416" height="104" rx="12" class="band"/>
  <text x="64" y="670" class="bandTitle">4. Independent Verifier Round</text>
  <rect x="92" y="690" width="330" height="34" rx="8" class="verify"/>
  <text x="112" y="712" class="label">deterministic-acceptance-verifier</text>
  <rect x="496" y="690" width="260" height="34" rx="8" class="verify"/>
  <text x="516" y="712" class="label">verifier_rounds verdict</text>
  <rect x="830" y="690" width="330" height="34" rx="8" class="verify"/>
  <text x="850" y="712" class="label">feedback references input_item_ids</text>

  <rect x="42" y="780" width="1416" height="52" rx="12" class="band"/>
  <text x="64" y="812" class="bandTitle">5. Reported Outputs</text>
  <rect x="286" y="793" width="220" height="26" rx="7" class="output"/>
  <text x="302" y="811" class="label">acceptance_output JSON</text>
  <rect x="548" y="793" width="230" height="26" rx="7" class="output"/>
  <text x="564" y="811" class="label">compile-report items table</text>
  <rect x="820" y="793" width="230" height="26" rx="7" class="output"/>
  <text x="836" y="811" class="label">Verifier Rounds table</text>

  <rect x="42" y="862" width="1416" height="116" rx="12" class="band"/>
  <text x="64" y="894" class="bandTitle">6. Architecture Advantages</text>
  <rect x="72" y="914" width="300" height="42" rx="8" class="state"/>
  <text x="90" y="932" class="label">Separates quality signals</text>
  <text x="90" y="949" class="small">tests prove execution; items prove PRD coverage</text>
  <rect x="404" y="914" width="300" height="42" rx="8" class="state"/>
  <text x="422" y="932" class="label">Auditable by construction</text>
  <text x="422" y="949" class="small">every verdict keeps ids, evidence, and warnings</text>
  <rect x="736" y="914" width="300" height="42" rx="8" class="state"/>
  <text x="754" y="932" class="label">Deterministic verifier</text>
  <text x="754" y="949" class="small">repeatable pass/fail summary without model drift</text>
  <rect x="1068" y="914" width="300" height="42" rx="8" class="state"/>
  <text x="1086" y="932" class="label">Better review handoff</text>
  <text x="1086" y="949" class="small">CLI, Web, and reports read the same schema</text>

  <path class="flow" d="M 660 246 L 660 286"/>
  <path class="flow" d="M 660 390 L 660 430"/>
  <path class="flow" d="M 660 600 L 660 640"/>
  <path class="flow" d="M 660 744 L 660 780"/>
  <path class="flow" d="M 660 832 L 660 862"/>
  <path class="soft" d="M 178 222 C 205 260 230 305 247 336"/>
  <path class="soft" d="M 420 222 C 470 270 530 305 603 336"/>
  <path class="soft" d="M 662 222 C 685 270 685 305 603 336"/>
  <path class="soft" d="M 904 222 C 940 270 960 305 969 336"/>
  <path class="soft" d="M 1142 222 C 1080 270 1010 305 969 336"/>
  <path class="soft" d="M 247 370 C 220 420 195 455 184 486"/>
  <path class="soft" d="M 603 370 C 510 420 455 455 450 486"/>
  <path class="soft" d="M 969 370 C 860 420 735 455 714 486"/>
  <path class="soft" d="M 969 370 C 980 420 985 455 970 486"/>
</svg>
