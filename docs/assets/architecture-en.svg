<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="920" viewBox="0 0 1320 920" role="img" aria-labelledby="title desc">
  <title id="title">code_minions layered architecture</title>
  <desc id="desc">Layered architecture diagram emphasizing specification inputs, workflow orchestration, shared agent runtime, typed run journal events, tool evidence, gates, browser acceptance evidence, failure classification, runtime state, and external integrations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 8; }
      .orch { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 8; }
      .skill { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; rx: 8; }
      .gate { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; rx: 8; }
      .runtime { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; rx: 8; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; rx: 8; }
      .output { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.4; rx: 8; }
      .title { fill: #0f172a; font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .layerTitle { fill: #0f172a; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 650 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #334155; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="920"/>
  <text x="40" y="48" class="title">code_minions Layered Architecture</text>
  <text x="40" y="74" class="text">A PRD/spec-driven workflow engine: YAML orchestration, shared agent runtime, typed run journal, deterministic gates, browser/product acceptance evidence, tool evidence, resumable state, and MCP integrations.</text>

  <rect x="40" y="105" width="1240" height="120" class="layer"/>
  <text x="60" y="132" class="layerTitle">1. Specification + Project Context</text>
  <rect x="70" y="150" width="210" height="52" class="input"/>
  <text x="88" y="173" class="label">PRD / Spec</text>
  <text x="88" y="192" class="small">Goal, users, features, constraints</text>
  <rect x="310" y="150" width="230" height="52" class="input"/>
  <text x="328" y="173" class="label">Delivery Profile</text>
  <text x="328" y="192" class="small">stack_id, test_command, gate strictness</text>
  <rect x="570" y="150" width="210" height="52" class="input"/>
  <text x="588" y="173" class="label">AGENTS.md</text>
  <text x="588" y="192" class="small">Repo conventions injected into prompts</text>
  <rect x="810" y="150" width="210" height="52" class="input"/>
  <text x="828" y="173" class="label">devflow.yaml</text>
  <text x="828" y="192" class="small">Default workflow, LLM provider, paths</text>
  <rect x="1050" y="150" width="190" height="52" class="input"/>
  <text x="1068" y="173" class="label">.mcp.json</text>
  <text x="1068" y="192" class="small">Jira, GitHub, custom MCP servers</text>

  <rect x="40" y="260" width="1240" height="135" class="layer"/>
  <text x="60" y="288" class="layerTitle">2. Entry + Workflow Orchestration</text>
  <rect x="70" y="310" width="195" height="58" class="orch"/>
  <text x="88" y="334" class="label">CLI / Web UI</text>
  <text x="88" y="354" class="small">Typer commands; FastAPI + HTMX dashboard</text>
  <rect x="300" y="310" width="215" height="58" class="orch"/>
  <text x="318" y="334" class="label">Workflow Loader</text>
  <text x="318" y="354" class="small">Built-in or project YAML; extends + presets</text>
  <rect x="550" y="310" width="210" height="58" class="orch"/>
  <text x="568" y="334" class="label">DAGRunner</text>
  <text x="568" y="354" class="small">Dependencies, for_each, resume boundaries</text>
  <text x="568" y="369" class="small">SkillRuntime -> AgentLoop</text>
  <rect x="795" y="310" width="210" height="58" class="orch"/>
  <text x="813" y="334" class="label">Agent Runtime</text>
  <text x="813" y="354" class="small">AgentLoop + LLMCallController</text>
  <text x="813" y="369" class="small">ToolRuntime + tool evidence</text>
  <rect x="1040" y="310" width="205" height="58" class="orch"/>
  <text x="1058" y="334" class="label">EventBus + SSE</text>
  <text x="1058" y="354" class="small">Step status + run.event stream</text>
  <text x="1058" y="369" class="small">Web runtime activity</text>

  <rect x="40" y="430" width="1240" height="150" class="layer"/>
  <text x="60" y="458" class="layerTitle">3. Skills + Stack Presets</text>
  <rect x="70" y="482" width="190" height="70" class="skill"/>
  <text x="88" y="506" class="label">Parse + Plan</text>
  <text x="88" y="526" class="small">parse-prd -> structured JSON</text>
  <text x="88" y="544" class="small">plan-tasks -> ordered tickets</text>
  <rect x="290" y="482" width="225" height="70" class="skill"/>
  <text x="308" y="506" class="label">Stack-aware PRD Flows</text>
  <text x="308" y="526" class="small">react-vite-prd-to-*</text>
  <text x="308" y="544" class="small">python-cli-prd-to-* presets</text>
  <rect x="545" y="482" width="205" height="70" class="skill"/>
  <text x="563" y="506" class="label">Implement with TDD</text>
  <text x="563" y="526" class="small">Shared AgentLoop, tests, self-heal</text>
  <text x="563" y="544" class="small">Command events + commits per task</text>
  <rect x="780" y="482" width="205" height="70" class="skill"/>
  <text x="798" y="506" class="label">Acceptance Skills</text>
  <text x="798" y="526" class="small">web-ui-acceptance-review</text>
  <text x="798" y="544" class="small">product acceptance + report</text>
  <rect x="1015" y="482" width="220" height="70" class="skill"/>
  <text x="1033" y="506" class="label">Open PR</text>
  <text x="1033" y="526" class="small">Push branch to origin</text>
  <text x="1033" y="544" class="small">Create or resolve GitHub PR</text>

  <rect x="40" y="615" width="1240" height="120" class="layer"/>
  <text x="60" y="642" class="layerTitle">4. Gates + Review Surface</text>
  <rect x="70" y="662" width="220" height="48" class="gate"/>
  <text x="88" y="684" class="label">Delivery Gates</text>
  <text x="88" y="702" class="small">required files, forbidden languages, stack checks</text>
  <rect x="325" y="662" width="220" height="48" class="gate"/>
  <text x="343" y="684" class="label">Test Gate</text>
  <text x="343" y="702" class="small">profile test command; pytest, Vitest, etc.</text>
  <rect x="580" y="662" width="230" height="48" class="gate"/>
  <text x="598" y="684" class="label">Failure Classification</text>
  <text x="598" y="702" class="small">provider vs workflow vs implementation</text>
  <rect x="845" y="662" width="220" height="48" class="gate"/>
  <text x="863" y="684" class="label">Acceptance Evidence</text>
  <text x="863" y="702" class="small">browser screenshots + verifier_rounds</text>
  <rect x="1100" y="662" width="140" height="48" class="gate"/>
  <text x="1118" y="684" class="label">Review UI</text>
  <text x="1118" y="702" class="small">CLI + Web dashboard</text>

  <rect x="40" y="770" width="1240" height="105" class="layer"/>
  <text x="60" y="798" class="layerTitle">5. Runtime, Integrations, Outputs</text>
  <rect x="70" y="812" width="205" height="54" class="runtime"/>
  <text x="88" y="844" class="label">SQLite RunStore</text>
  <text x="88" y="860" class="small">runs, steps, typed run journal</text>
  <rect x="305" y="812" width="215" height="54" class="runtime"/>
  <text x="323" y="844" class="label">Git Worktrees</text>
  <text x="323" y="860" class="small">isolated branches and commits</text>
  <rect x="550" y="812" width="205" height="54" class="external"/>
  <text x="568" y="844" class="label">LLM Providers</text>
  <text x="568" y="860" class="small">LiteLLM, MiniMax, Gemini, etc.</text>
  <rect x="785" y="812" width="205" height="54" class="external"/>
  <text x="803" y="844" class="label">MCP: Jira + GitHub</text>
  <text x="803" y="860" class="small">tool argument policy + pooling</text>
  <rect x="1020" y="812" width="220" height="54" class="output"/>
  <text x="1038" y="844" class="label">Delivery Artifacts</text>
  <text x="1038" y="860" class="small">commits, evidence, browser evidence, PR</text>

  <path class="arrow" d="M 660 225 L 660 260"/>
  <path class="arrow" d="M 660 395 L 660 430"/>
  <path class="arrow" d="M 660 580 L 660 615"/>
  <path class="arrow" d="M 660 735 L 660 770"/>
  <path class="soft" d="M 420 202 C 460 248 495 275 610 310"/>
  <path class="soft" d="M 185 202 C 210 270 250 410 375 482"/>
  <path class="soft" d="M 650 552 C 650 595 635 630 690 662"/>
  <path class="soft" d="M 750 552 C 850 600 925 615 955 662"/>
  <path class="soft" d="M 895 552 C 930 650 890 760 890 820"/>
  <path class="soft" d="M 1115 552 C 1130 650 1130 760 1130 820"/>
</svg>
