<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">code_minions architecture</title>
  <desc id="desc">Architecture diagram showing project inputs, CLI and web entrypoints, engine orchestration, workflow execution, skills, LLM providers, MCP integrations, git worktrees, SQLite state, and outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .core { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .skill { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; rx: 8; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; rx: 8; }
      .store { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; rx: 8; }
      .output { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.4; rx: 8; }
      .label { fill: #0f172a; font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #334155; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #475569; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1180" height="720"/>
  <text x="40" y="46" class="label" style="font-size:26px">code_minions Architecture</text>
  <text x="40" y="72" class="text">Repeatable AI development workflows with isolated worktrees, resumable state, stack-aware skills, and MCP integrations.</text>

  <rect x="40" y="110" width="220" height="180" class="panel"/>
  <text x="60" y="142" class="label">User Project</text>
  <text x="60" y="170" class="text">AGENTS.md</text>
  <text x="60" y="194" class="text">devflow.yaml</text>
  <text x="60" y="218" class="text">.mcp.json</text>
  <text x="60" y="242" class="text">PRD / source repo</text>
  <text x="60" y="266" class="small">Git repo with commits</text>

  <rect x="320" y="110" width="220" height="120" class="core"/>
  <text x="340" y="142" class="label">Entry Points</text>
  <text x="340" y="170" class="text">Typer CLI</text>
  <text x="340" y="194" class="text">FastAPI + HTMX Web UI</text>
  <text x="340" y="214" class="small">run, status, resume, web</text>

  <rect x="610" y="105" width="250" height="210" class="core"/>
  <text x="630" y="137" class="label">Engine Core</text>
  <text x="630" y="166" class="text">Workflow loader</text>
  <text x="630" y="190" class="text">ContextAssembler</text>
  <text x="630" y="214" class="text">DAGRunner</text>
  <text x="630" y="238" class="text">SkillRuntime</text>
  <text x="630" y="262" class="text">EventBus</text>
  <text x="630" y="290" class="small">Resumes failed runs from stored step state</text>

  <rect x="930" y="110" width="210" height="180" class="store"/>
  <text x="950" y="142" class="label">State + Workspace</text>
  <text x="950" y="170" class="text">SQLite RunStore</text>
  <text x="950" y="194" class="text">.devflow/runs.db</text>
  <text x="950" y="218" class="text">WorktreeManager</text>
  <text x="950" y="242" class="text">code-minions/&lt;run-id&gt;</text>
  <text x="950" y="266" class="small">Per-run isolated branch</text>

  <rect x="40" y="380" width="230" height="210" class="skill"/>
  <text x="60" y="412" class="label">Built-In Workflows</text>
  <text x="60" y="442" class="text">prd-to-commit</text>
  <text x="60" y="466" class="text">react-vite-prd-to-commit</text>
  <text x="60" y="490" class="text">python-cli-prd-to-commit</text>
  <text x="60" y="514" class="text">react-vite-prd-to-pr</text>
  <text x="60" y="538" class="text">python-cli-prd-to-pr</text>
  <text x="60" y="566" class="small">Thin stack presets extend base DAGs</text>

  <rect x="320" y="360" width="250" height="250" class="skill"/>
  <text x="340" y="392" class="label">Skills</text>
  <text x="340" y="422" class="text">parse-prd</text>
  <text x="340" y="446" class="text">plan-tasks</text>
  <text x="340" y="470" class="text">create-jira-tickets</text>
  <text x="340" y="494" class="text">implement-with-tdd</text>
  <text x="340" y="518" class="text">product-acceptance-review</text>
  <text x="340" y="542" class="text">compile-report</text>
  <text x="340" y="566" class="text">open-github-pr</text>
  <text x="340" y="592" class="small">SKILL.md + optional entrypoint scripts</text>

  <rect x="640" y="370" width="220" height="110" class="external"/>
  <text x="660" y="402" class="label">LLM Providers</text>
  <text x="660" y="432" class="text">LiteLLM adapter</text>
  <text x="660" y="456" class="text">OpenAI / Anthropic / Gemini</text>
  <text x="660" y="474" class="small">MiniMax, DeepSeek, Ollama, ...</text>

  <rect x="640" y="510" width="220" height="120" class="external"/>
  <text x="660" y="542" class="label">MCP Integrations</text>
  <text x="660" y="572" class="text">MCPClientPool</text>
  <text x="660" y="596" class="text">Jira, GitHub, custom servers</text>
  <text x="660" y="616" class="small">Configured through .mcp.json</text>

  <rect x="930" y="390" width="210" height="190" class="output"/>
  <text x="950" y="422" class="label">Outputs</text>
  <text x="950" y="452" class="text">Implementation commits</text>
  <text x="950" y="476" class="text">report.md</text>
  <text x="950" y="500" class="text">Jira Epic + Stories</text>
  <text x="950" y="524" class="text">GitHub branch + PR</text>
  <text x="950" y="552" class="small">Inspect with status/list-runs/web</text>

  <path class="arrow" d="M 260 180 C 285 180 295 170 320 170"/>
  <path class="arrow" d="M 540 170 C 570 170 580 170 610 170"/>
  <path class="arrow" d="M 860 180 C 890 180 900 190 930 200"/>
  <path class="arrow" d="M 735 315 C 735 340 650 370 570 420"/>
  <path class="arrow" d="M 270 485 C 292 485 298 485 320 485"/>
  <path class="arrow" d="M 570 425 C 600 425 610 425 640 425"/>
  <path class="arrow" d="M 570 555 C 600 555 610 565 640 570"/>
  <path class="arrow" d="M 860 570 C 890 560 900 520 930 500"/>
  <path class="arrow" d="M 860 430 C 900 430 900 445 930 455"/>
  <path class="soft-arrow" d="M 930 250 C 890 330 845 360 805 370"/>
  <path class="soft-arrow" d="M 155 290 C 155 330 155 350 155 380"/>
  <path class="soft-arrow" d="M 735 105 C 735 80 200 82 150 110"/>
</svg>
