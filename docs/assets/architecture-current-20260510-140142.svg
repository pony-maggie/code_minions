<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">code_minions current architecture, 2026-05-10</title>
  <desc id="desc">Current code_minions architecture showing project inputs, CLI and web entry points, workflow orchestration, skill execution, deterministic gates, runtime state, external services, and delivery outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .input { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; }
      .entry { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.4; }
      .core { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .skill { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; }
      .gate { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; }
      .state { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
      .output { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.4; }
      .titleText { fill: #0f172a; font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bandTitle { fill: #0f172a; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #334155; stroke-width: 1.7; marker-end: url(#arrow); }
      .softFlow { fill: none; stroke: #64748b; stroke-width: 1.25; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="980"/>
  <text x="48" y="52" class="titleText">code_minions Current Architecture</text>
  <text x="48" y="78" class="subtitle">Generated 2026-05-10 14:01:42 local time. Focus: PRD-to-commit/PR delivery, stack-aware presets, deterministic gates, review surface, and resumable local state.</text>

  <rect x="38" y="112" width="1424" height="118" rx="12" class="band"/>
  <text x="60" y="142" class="bandTitle">1. Project Inputs and Contracts</text>
  <rect x="70" y="162" width="205" height="45" rx="8" class="input"/>
  <text x="88" y="184" class="label">PRD / Spec</text>
  <text x="88" y="201" class="small">features, users, acceptance</text>
  <rect x="302" y="162" width="222" height="45" rx="8" class="input"/>
  <text x="320" y="184" class="label">Delivery Profile</text>
  <text x="320" y="201" class="small">stack_id, gates, test command</text>
  <rect x="552" y="162" width="200" height="45" rx="8" class="input"/>
  <text x="570" y="184" class="label">AGENTS.md</text>
  <text x="570" y="201" class="small">repo rules injected into prompts</text>
  <rect x="780" y="162" width="205" height="45" rx="8" class="input"/>
  <text x="798" y="184" class="label">devflow.yaml</text>
  <text x="798" y="201" class="small">default workflow, LLM, paths</text>
  <rect x="1012" y="162" width="188" height="45" rx="8" class="input"/>
  <text x="1030" y="184" class="label">.mcp.json</text>
  <text x="1030" y="201" class="small">external tool servers</text>
  <rect x="1228" y="162" width="195" height="45" rx="8" class="input"/>
  <text x="1246" y="184" class="label">Repo State</text>
  <text x="1246" y="201" class="small">git branch, files, prior runs</text>

  <rect x="38" y="260" width="1424" height="132" rx="12" class="band"/>
  <text x="60" y="290" class="bandTitle">2. Entry Points and Shared Runtime</text>
  <rect x="70" y="313" width="220" height="52" rx="8" class="entry"/>
  <text x="88" y="336" class="label">Typer CLI</text>
  <text x="88" y="354" class="small">run, status, resume, list-runs, web</text>
  <rect x="320" y="313" width="245" height="52" rx="8" class="entry"/>
  <text x="338" y="336" class="label">FastAPI Web Dashboard</text>
  <text x="338" y="354" class="small">HTMX forms, SSE run detail, localhost only</text>
  <rect x="596" y="313" width="220" height="52" rx="8" class="core"/>
  <text x="614" y="336" class="label">Engine Facade</text>
  <text x="614" y="354" class="small">loads config, starts and resumes runs</text>
  <rect x="846" y="313" width="238" height="52" rx="8" class="core"/>
  <text x="864" y="336" class="label">Workflow Loader</text>
  <text x="864" y="354" class="small">built-ins, project YAML, extends, presets</text>
  <rect x="1114" y="313" width="272" height="52" rx="8" class="core"/>
  <text x="1132" y="336" class="label">Background + Event Streaming</text>
  <text x="1132" y="354" class="small">BackgroundTasks, EventBus, terminal snapshots</text>

  <rect x="38" y="422" width="1424" height="182" rx="12" class="band"/>
  <text x="60" y="452" class="bandTitle">3. Orchestration, Context, and Built-in Delivery Flows</text>
  <rect x="70" y="474" width="218" height="76" rx="8" class="core"/>
  <text x="88" y="497" class="label">DAGRunner</text>
  <text x="88" y="516" class="body">step dependency graph</text>
  <text x="88" y="534" class="body">for_each expansion and resume points</text>
  <rect x="318" y="474" width="230" height="76" rx="8" class="core"/>
  <text x="336" y="497" class="label">ContextAssembler</text>
  <text x="336" y="516" class="body">PRD + AGENTS.md + prior outputs</text>
  <text x="336" y="534" class="body">workspace and prompt package</text>
  <rect x="578" y="474" width="238" height="76" rx="8" class="core"/>
  <text x="596" y="497" class="label">Agent Profile Layer</text>
  <text x="596" y="516" class="body">role and stack profile resolution</text>
  <text x="596" y="534" class="body">temperature, strictness, guidance</text>
  <rect x="846" y="474" width="250" height="76" rx="8" class="skill"/>
  <text x="864" y="497" class="label">Stack-aware Presets</text>
  <text x="864" y="516" class="body">react-vite, python-cli, python-web</text>
  <text x="864" y="534" class="body">go-service, swift-xcodegen, generic PRD</text>
  <rect x="1126" y="474" width="260" height="76" rx="8" class="skill"/>
  <text x="1144" y="497" class="label">PRD Delivery Paths</text>
  <text x="1144" y="516" class="body">prd-to-commit for local audited commits</text>
  <text x="1144" y="534" class="body">prd-to-pr for Jira + GitHub PR flow</text>
  <rect x="70" y="565" width="1316" height="20" rx="5" class="panel"/>
  <text x="88" y="579" class="small">Representative built-ins: parse-prd, plan-tasks, create-jira-tickets, implement-with-tdd, ai-code-review, product-acceptance, open-github-pr, compile-report, summarize-file.</text>

  <rect x="38" y="634" width="1424" height="134" rx="12" class="band"/>
  <text x="60" y="664" class="bandTitle">4. Execution Loop, Deterministic Gates, and Review Surface</text>
  <rect x="70" y="688" width="220" height="52" rx="8" class="skill"/>
  <text x="88" y="711" class="label">SkillRuntime</text>
  <text x="88" y="729" class="small">handler scripts or LLM agentic loop</text>
  <rect x="320" y="688" width="226" height="52" rx="8" class="external"/>
  <text x="338" y="711" class="label">LiteLLM Backend</text>
  <text x="338" y="729" class="small">Anthropic, OpenAI, Gemini, MiniMax, Ollama</text>
  <rect x="576" y="688" width="228" height="52" rx="8" class="gate"/>
  <text x="594" y="711" class="label">Delivery Gates</text>
  <text x="594" y="729" class="small">stack contracts, files, routes, deps, syntax</text>
  <rect x="834" y="688" width="220" height="52" rx="8" class="gate"/>
  <text x="852" y="711" class="label">Test + Acceptance</text>
  <text x="852" y="729" class="small">pytest, Vitest, product verifier rounds</text>
  <rect x="1084" y="688" width="302" height="52" rx="8" class="gate"/>
  <text x="1102" y="711" class="label">Gate Findings Review Surface</text>
  <text x="1102" y="729" class="small">canonical findings, repair hints, CLI and Web display</text>

  <rect x="38" y="798" width="1424" height="130" rx="12" class="band"/>
  <text x="60" y="828" class="bandTitle">5. Persistent State, Isolation, Integrations, and Outputs</text>
  <rect x="70" y="852" width="205" height="48" rx="8" class="state"/>
  <text x="88" y="874" class="label">SQLite RunStore</text>
  <text x="88" y="892" class="small">runs, steps, outputs, status</text>
  <rect x="305" y="852" width="218" height="48" rx="8" class="state"/>
  <text x="323" y="874" class="label">Git Worktrees</text>
  <text x="323" y="892" class="small">one isolated workspace per run</text>
  <rect x="553" y="852" width="205" height="48" rx="8" class="external"/>
  <text x="571" y="874" class="label">MCP Pool</text>
  <text x="571" y="892" class="small">Jira, GitHub, custom stdio tools</text>
  <rect x="788" y="852" width="205" height="48" rx="8" class="output"/>
  <text x="806" y="874" class="label">Local Commits</text>
  <text x="806" y="892" class="small">task commits and reports</text>
  <rect x="1023" y="852" width="188" height="48" rx="8" class="output"/>
  <text x="1041" y="874" class="label">Jira Tickets</text>
  <text x="1041" y="892" class="small">epic and story structure</text>
  <rect x="1241" y="852" width="145" height="48" rx="8" class="output"/>
  <text x="1259" y="874" class="label">GitHub PR</text>
  <text x="1259" y="892" class="small">branch push and PR URL</text>

  <path class="flow" d="M 750 230 L 750 260"/>
  <path class="flow" d="M 706 365 L 706 422"/>
  <path class="flow" d="M 706 604 L 706 634"/>
  <path class="flow" d="M 706 768 L 706 798"/>
  <path class="softFlow" d="M 180 365 C 210 410 150 440 160 474"/>
  <path class="softFlow" d="M 445 365 C 470 410 450 440 438 474"/>
  <path class="softFlow" d="M 706 365 C 710 405 700 435 697 474"/>
  <path class="softFlow" d="M 972 550 C 965 600 965 650 944 688"/>
  <path class="softFlow" d="M 1256 550 C 1280 640 1280 790 1314 852"/>
  <path class="softFlow" d="M 436 740 C 470 790 590 820 655 852"/>
  <path class="softFlow" d="M 686 740 C 680 790 320 805 414 852"/>
  <path class="softFlow" d="M 944 740 C 950 790 930 820 894 852"/>
  <path class="softFlow" d="M 1235 740 C 1210 790 1130 820 1116 852"/>
  <path class="softFlow" d="M 1298 740 C 1340 790 1358 815 1314 852"/>
</svg>
