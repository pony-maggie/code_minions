<tr id="step-{{ step.step_id }}" class="border-b border-gray-100">
  <td class="px-4 py-2 font-mono">{{ step.step_id }}</td>
  <td class="px-4 py-2">
    <span class="px-2 py-0.5 text-xs rounded
      {% if step.status == 'success' %}bg-green-100 text-green-800
      {% elif step.status == 'failed' %}bg-red-100 text-red-800
      {% elif step.status == 'running' %}bg-blue-100 text-blue-800
      {% else %}bg-yellow-100 text-yellow-800{% endif %}">
      {{ step.status }}
    </span>
  </td>
  <td class="px-4 py-2 text-gray-700 text-xs">{{ step.detail or "" }}</td>
  <td class="px-4 py-2 text-red-700 text-xs">{{ step.error or "" }}</td>
</tr>
