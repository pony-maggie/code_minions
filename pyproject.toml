[project]
name = "code-minions"
version = "0.1.0"
description = "MCP-based AI dev workflow CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "malu"}]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "litellm>=1.40",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
web-e2e = [
    "playwright>=1.45",
]

[project.scripts]
code-minions = "code_minions.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_minions"]

[tool.hatch.build.targets.wheel.force-include]
"src/code_minions/builtin" = "code_minions/builtin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/code_minions"]
omit = ["*/builtin/skills/*/scripts/run.py"]   # deterministic entrypoints tested indirectly via e2e

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]   # handled by line-length
